# Teste manual do site publicado (Actions > "checar site" > Run workflow).
# Só lê as rotas públicas; não grava visita (usa user-agent de robô) e não usa a senha do painel.
# O resultado aparece no log e também como um "check" no último commit (aba Checks).
name: checar site
on:
  workflow_dispatch:
permissions:
  checks: write
  contents: read
jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - name: testar as rotas
        run: |
          S=https://ariesdasilva.ariess.workers.dev
          {
            echo "## página"
            curl -sS -o /dev/null -m 20 -w "HTTP %{http_code} %{content_type} %{size_download} bytes" "$S/"; echo; echo
            echo "## api/ping"
            curl -sS -i -m 20 "$S/api/ping" | head -c 800; echo; echo
            echo "## api/stats com senha errada de propósito (tem que dar 401 em JSON)"
            curl -sS -i -m 20 -H "x-panel-key: errada" "$S/api/stats?limit=1" | head -c 800; echo; echo
            echo "## api/hit com user-agent de robô (não grava nada)"
            curl -sS -i -m 20 -X POST -A "teste-bot" -H "Content-Type: application/json" -d '{"type":"visit","vid":"teste"}' "$S/api/hit" | head -c 800; echo
          } > saida.txt 2>&1 || true
          cat saida.txt
      - name: publicar o resultado como check do commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/check-runs" -f name="checar site: resultado" -f head_sha="${{ github.sha }}" \
            -f status=completed -f conclusion=neutral -f "output[title]=resultado do teste" -f "output[summary]=$(cat saida.txt)" > /dev/null
